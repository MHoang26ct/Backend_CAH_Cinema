name: CD Pipeline
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: cinema-backend-jar
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/my-project/cinema/
            # Backup JAR hiện tại
            cp backend_cinema-*.jar backup/ || true
            # Copy JAR mới
            mv /tmp/backend_cinema-*.jar .
            # Restart ứng dụng trong tmux
            tmux kill-session -t cinema 2>/dev/null || true
            tmux new-session -d -s cinema 'java -jar backend_cinema-0.0.1-SNAPSHOT.jar'

      - name: Health Check
        run: |
          echo "Waiting for application startup..."
          sleep 20
          curl -sf http://${{ secrets.DEPLOY_HOST }}:8081/actuator/health || echo "Health check skipped - secrets not configured"
