server:
  port: 8080 # Cổng chạy backend

spring:
  application:
    name: cinema-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

# Bật màu sắc trực quan cho console và cấu hình Log
spring.output.ansi.enabled: ALWAYS

logging:
  level:
    root: INFO
    # Xem các lỗi chặn của Spring Security
    org.springframework.security: DEBUG
    # Xem chi tiết tham số (parameters) được truyền vào câu lệnh SQL thay vì dấu ?
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.SQL: DEBUG
  pattern:
    # Format log siêu trực quan: Thời gian | Level | Thread | Logger | Message
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"