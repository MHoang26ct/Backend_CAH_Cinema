server:
  port: 8080 # Cổng chạy backend

spring:
  application:
    name: cinema-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

  data:
    redis:
      host: localhost
      port: ${REDIS_PORT}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GG_APP_PASSWORD}
    properties:
        mail:
            smtp:
              auth: true
              starttls:
                enable: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

# Bật màu sắc trực quan cho console và cấu hình Log
spring.output.ansi.enabled: ALWAYS

logging:
  level:
    root: INFO
    # Xem các lỗi chặn của Spring Security
    org.springframework.security: DEBUG
    # Xem chi tiết tham số (parameters) được truyền vào câu lệnh SQL thay vì dấu ?
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.SQL: DEBUG
  pattern:
    # Format log siêu trực quan: Thời gian | Level | Thread | Logger | Message
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"

momo:
  partner-code: ${MOMO_PARTNER_CODE}
  access-key: ${MOMO_ACCESS_KEY}
  secret-key: ${MOMO_SECRET_KEY}
  endpoint: ${MOMO_ENDPOINT}
  redirect-url: ${MOMO_REDIRECT_URL}
  ipn-url: ${MOMO_IPN_URL}
  payment-request-ttl-minutes: 10  # Thời gian QR còn hợp lệ (phút), sau đó cho phép tạo QR mới

vnpay:
  tmn-code: ${VNPAY_TMN_CODE}
  hash-secret: ${VNPAY_HASH_SECRET}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL}
  ipn-url: ${VNPAY_IPN_URL}
  payment-request-ttl-minutes: 15